[package]
name = "fast-layout-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Graph layout kernels for Rust and the fast-layout Typst package"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nalgebra = { version = "0.33.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
wasm-minimal-protocol = "0.1"

[dev-dependencies]
serde_json = "1"

[[bench]]
name = "layouts"
harness = false
