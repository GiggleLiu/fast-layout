name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typst: ["0.14.2", "0.15.1"]
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ matrix.typst }}
      - run: rustup component add clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: make test
      - name: Check rebuilt WASM
        if: matrix.typst == '0.14.2'
        run: git diff --exit-code -- fast-layout/plugin/fast_layout_engine.wasm
      - name: Check submission bundle and README examples
        run: make check-package
